<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href='https://fonts.googleapis.com/css?family=Caveat Brush' rel='stylesheet'>
    <link href='https://fonts.googleapis.com/css?family=Public Sans' rel='stylesheet'>
    <title>Hinomaru Meals - Recipes</title>
    <link rel="apple-touch-icon" sizes="180x180" href="Assets/Favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="Assets/Favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="Assets/Favicon/favicon-16x16.png">
    <link rel="manifest" href="Assets/Favicon/site.webmanifest">
</head>

<body>
    <header>
        <img id="logo" src="Assets/HinomaruMealsLogo.png" alt="Logo">
        <h3>Hinomaru Meals</h3>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="cuisine.html">Cuisine</a></li>
                <li><a href="recipes.html">Recipes</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <div class="recipe-container">
        <button onclick="RiceballRecipe()" id="riceballs" class="recipe">
            <h2>Rice Balls</h2>
        </button>
        <button onclick="RamenRecipe()" id="ramen" class="recipe">
            <h2>Ramen</h2>
        </button>
        <button onclick="SushiRecipe() "id="sushi" class="recipe">
            <h2>Sushi</h2>
        </button>
        <button onclick="CurryRecipe()" id="curry" class="recipe">
            <h2>Curry Rice</h2>
        </button>
    </div>

    <div class="content" id="instructions">
        <div class="sideimg-div">
            <img> 
        </div>

        <div class="content-item paragraph-div">
            <h1>Please select a recipe.</h1>
            <h2 id="required-ingredients"></h2>
            <h3 id="required-list"></h3>
            <h2 id="customisable-ingredients"></h2>
            <h3 id="optional-list"></h3>
            <h2 id="instructions-title"></h2>
            <p></p>
        </div>
    </div>
</body>

<script>
    var paragraph = document.querySelector("#instructions .content-item p");
    var dishTitle = document.querySelector("#instructions .content-item h1");
    var requiredIngredients = document.querySelector("#instructions .content-item #required-ingredients");
    var requiredList = document.querySelector("#instructions .content-item #required-list");
    var customisableIngredients = document.querySelector("#instructions .content-item #customisable-ingredients");
    var optionalList = document.querySelector("#instructions .content-item #optional-list");
    var instructionsTitle = document.querySelector("#instructions .content-item #instructions-title");
    var foodimage = document.querySelector("#instructions .sideimg-div img");

    const recipeImagePaths = [
        "Images/Rice balls.jpg",
        "Images/ramen.jpg",
        "Images/curry-rice.jpg",
        "Images/sushi.jpg"
    ];

    recipeImagePaths.forEach((path) => {
        const image = new Image();
        image.src = path;
    });
    
    function recipeSelected() {
        foodimage.style.display = "block";
        foodimage.classList.add("recipe-selected-border");
        sessionStorage.setItem("recipeSelected", "true");
    }
    
    function RiceballRecipe() {
        foodimage.src = 'Images/Rice balls.jpg'
        foodimage.alt = 'Onigiri/Rice Balls'
        recipeSelected();
        dishTitle.textContent = "Rice Balls"
        requiredIngredients.textContent = "Required Ingredients:"
        requiredList.innerHTML = `- 2 cups of short-grained rice <br> 
        - 1/2 teaspoon of salt <br>
        - 4 sheets of roasted seaweed <br>
        `;
        customisableIngredients.textContent = "Customisable Ingredients:"
        optionalList.innerHTML = `- Umeboshi (Pickled Plum) <br> 
        - Katsuobushi (dried bonito flakes) <br>
        - Furikake (Typical Japanese Rice Seasoning) <br>
        - Tuna Mayo (can be canned) <br>
        - Meats like cooked beef or chicken (typical meats in Onigiri) <br>
        - Smoked Salmon <br>
        `;
        instructionsTitle.textContent = "|| Serving for 4 || Instructions:"
        paragraph.innerHTML = `1. Prepare 2 cups of steamed rice according to the instructions of your rice cooker, or instructions on the pouch if using instant rice. <br>
        2. In a bowl, place the rice to let it cool down while you prepare for the next step; wet your hands with water and sprinkle a quarter of the salt onto your hand. Take a handful of rice and begin to press the rice into a flat ball/triangle shape using your hands. Try to make the rice shaped in your hand around 1.5cm thick so it can hold without crumbling. If needed, add more rice.<br>
        3. In the middle of the pressed rice, form a dip in the center that does not penetrate to the other side of the rice. Leave roughly 4cm of space around the edges of the rice ball when making the hole. If adding filling, use one filling and fill up the hole until the stack is slightly taller than the surface of the rice. <br>
        4. Keep on adding handfuls of rice from the bowl into your hands and pressing into shape until you cannot see the filling inside. If not adding filling, add rice until the Onigiri reaches a preferred, serveable size.<br>
        5. Cut a long strip of roasted seaweed roughly the same width as the rice ball. Place the rice ball in the middle of the seaweed strip, and raise both ends of the seaweed to fold on the rice ball. <br>
        6. Garnish with Furikake/Katsuobushi. Repeat 3 more times from Step 2 (or until all rice has been used up) and enjoy!
        `;
    }

    function RamenRecipe() {
        foodimage.src = 'Images/ramen.jpg'
        foodimage.alt = 'Ramen/Noodles'
        recipeSelected();
        dishTitle.textContent = "Shoyu (Soy Sauce) Ramen"
        requiredIngredients.textContent = "Required Ingredients:"
        requiredList.innerHTML = `- 1/2 cup of Soy Sauce <br> 
        - 5 cups of Chicken Soup <br>
        - 600g of Ramen noodles <br>
        `;
        customisableIngredients.textContent = "Customisable Ingredients:"
        optionalList.innerHTML = `- Roasted Seaweed <br> 
        - Boiled Eggs (The popular soy-sauce eggs are called Ajitama - flavour balls)<br>
        - Any red meats like chicken, pork or beef <br>
        - Spring Onions (known as Negi)<br>
        - Pickled Bamboo (known as Menma) <br>
        - Spinach <br>
        - Narutomaki (fish cakes) <br>
        `;
        instructionsTitle.textContent = "|| Serving for 4 || Instructions:"
        paragraph.innerHTML = ` <span style="text-decoration: underline;">Before starting, ensure that all toppings are prepared, as the preparation of the noodles is quick. The noodles also cannot sit out for a long period of time as they will become chewy.</span> <br><br>
        1. Bring a large pot of water to a boil on medium-high heat. <br>
        2. To make the broth, mix the soy sauce and chicken soup in a medium-sized saucepan. Bring the mixture to a simmer over low heat, but not boiling. <br>
        3. Place the noodles in the boiling pot of water. Set a timer for 1 minute and 30 seconds. You may need to adjust the time if you have thinner/thicker noodles. <br>
        4. Before the timer finishes, use a ladle to scoop up the broth into four bowls. <br>
        5. When the timer reaches zero, use a strainer to drain water off the noodles. Make sure to shake off excess water well so they do not get soggy. Share the noodles in the bowls equally. <br>
        6. Top the bowls off with your garnishes/toppings. <br>
        6b. If you are going to use seaweed paper, make sure that only one edge is dipped in the broth, while the rest lies on the side of the bowl. This is to keep the seaweed crispy. <br>
        7. Serve immediately for the best taste.

        `;
    }

    function CurryRecipe() {
        foodimage.src = 'Images/curry-rice.jpg'
        foodimage.alt = 'Japanese Curry Rice'
        recipeSelected();
        dishTitle.textContent = "Curry Rice"
        requiredIngredients.textContent = "Required Ingredients:"
        requiredList.innerHTML = `- A pack of store-bought Japanese curry roux <br> 
        - Cooked Rice <br>
        - 1 potato <br>
        - 1 carrot <br>
        - One type of red meat (beef, chicken or pork) <br>
        - 1 Onion <br>
        - Garlic <br>
        `;
        customisableIngredients.textContent = "Customisable Ingredients:"
        optionalList.innerHTML = ` - Cheese <br>
        - Raisins <br>
        - Any vegetables of your choice (e.g. mushrooms, bell peppers, etc.) <br>
        `;
        instructionsTitle.textContent = "|| Serving for 4 || Instructions:"
        paragraph.innerHTML = ` If preparing rice with a rice cooker, start the cooking process before making the curry roux to serve it while hot. Otherwise, if using instant rice, prepare it when the curry is ready. <br><br>
        1. Peel the skin off the potato and carrot, and cut them into bite-sized chunks. Set aside. <br>
        2. Peel the skin off the onion and cut it into thin slices. Set aside. <br>
        3. Mince the garlic and set it aside. <br>
        4. Cut the meat into bite-sized chunks. Set aside. <br>
        5. In a large pot, add a small amount of vegetable oil and turn on medium heat. Add the garlic and onions, and stir-fry until the onions are translucent, not golden brown. <br>
        6. Add the meat of your choice and cook until the meat is browned on all sides. <br>
        7. Throw in the potato and carrot, and cook for 2-3 minutes. Turn off the heat. <br>
        8. Add water to the pot until the ingredients are fully submerged. Bring the water to a boil, and then reduce the heat to low. Cover the pot with a lid and periodically check to strain off any scum on the surface of the water using a skimmer. Let the curry simmer for 15-20 minutes. <br>
        9. Turn off the heat. Take one piece of the curry roux and put it in a mesh strainer. Submerge the roux in the pot so it does not escape from the mesh strainer, and use a spoon or chopsticks to crush the roux into smaller pieces. Fully dissolve the roux into the curry and make sure no lumps are present in the pot. <br>
        10. Using a ladle, serve the curry over a portion of rice, and enjoy! <br>
        10b. Add any toppings at this point. If you are adding cheese, place it on top of the curry while it is still hot so that it melts. <br>
        `;
    }

    function SushiRecipe() {
        foodimage.src = 'Images/sushi.jpg'
        foodimage.alt = 'Maki (rolled) Sushi'
        recipeSelected();
        dishTitle.textContent = "Maki (rolled) Sushi"
        requiredIngredients.textContent = "Required Ingredients:"
        requiredList.innerHTML = `- 1kg of short-grain sushi-rice <br> 
        - Large sheets of nori (roasted seaweed) <br>
        - 80g Rice Vinegar <br>
        - 50g Sugar <br>
        - 14g salt <br>
        `;
        customisableIngredients.textContent = "Customisable Ingredients:"
        optionalList.innerHTML = `- Sashimi-grade salmon/tuna or Teriyaki Chicken <br> 
        - Vegetables such as cucumber or Shiitake mushrooms <br>
        - Crab meat-sticks <br>
        - Soy Sauce and Wasabi <br>
        - Avocado <br>
        Many more ingredients can be added to sushi. Try adding your favourite ingredients to make your own unique sushi! <br>
        `;
        instructionsTitle.textContent = "|| Serving for 7 || Instructions:"
        paragraph.innerHTML = ` 1. Prepare the short-grain sushi-rice by using the instructions of your rice cooker. <br>
        2. Once the rice is cooked, transfer it to a large bowl and let it cool down. <br>
        3. Combine the sugar and salt in the rice vinegar and stir until dissolved. Pour the mixture over the rice and gently fold it in using a wooden spoon or spatula. Be careful not to mash the rice, and make sure the vinegar is evenly coated. <br>
        4. Place plastic wrap on top of a rolling mat, shiny side down. Place a sheet of nori on top of the plastic wrap. Wet your hands with water and take a handful of rice, spreading it evenly over the nori. Leave about an inch of space at the top edge. <br>
        5. Place your desired fillings in a horizontal line across the center of the rice. It is okay if some of the filling goes past the edges. <br>
        6. Start rolling the sushi away from you tightly using the rolling mat, applying gentle pressure to shape it into a cylinder. If you find it difficult to roll all the way around, try to remove some of the filling to make the rolling process easier, as you may have put too much. <br>
        7. Repeat from steps 4 to 6 until all of the sushi rice has been used up. Once finished, use a knife to cut up the sushi into bite-sized pieces. <br>
        `;
    }
</script>

</html>
